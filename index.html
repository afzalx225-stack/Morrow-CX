<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827"><meta name="description" content="MorrowCX Support Desk">
  <link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
  <title>MorrowCX — Support Desk</title>
</head>
<body>
  <div id="authRoot"><main class="auth-wrap"><section class="auth-card"><h1>Loading MorrowCX…</h1><p class="subtle">Connecting to your workspace.</p></section></main></div>
  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#"><span class="brand-mark">M</span><span><b>MorrowCX</b><small>SUPPORT DESK</small></span></a>
      <div class="workspace-switch"><small>WORKSPACE</small><b id="workspaceName">Loading workspace…</b><span id="workspaceMode">Connected</span></div>
      <nav>
        <button class="nav active" data-page="overview">▦ <span>Overview</span></button>
        <button class="nav" data-page="inbox">▤ <span>Inbox</span></button>
        <button class="nav" data-page="customers">♙ <span>Customers</span></button>
        <button class="nav" data-page="knowledge">▧ <span>Knowledge base</span></button>
        <button class="nav" data-page="followups">◷ <span>Follow-ups</span></button>
        <button class="nav" data-page="reports">▥ <span>Reports</span></button>
      </nav>
      <div class="sidebar-bottom"><button class="nav" data-page="settings">⚙ <span>Settings</span></button><div class="profile"><div class="avatar">M</div><span><b id="profileName">MorrowCX Admin</b><small id="profileEmail">Signed in</small></span></div><button class="nav" id="signOutBtn">↪ <span>Sign out</span></button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><small id="eyebrow">WORKSPACE</small><h1 id="pageTitle">Overview</h1></div><div class="top-actions"><span class="live-pill">LIVE DATABASE</span><button class="primary" id="newEnquiry">＋ New enquiry</button></div></header>
      <div id="notice" class="notice" hidden></div>
      <section id="pageContent"></section>
      <footer>MorrowCX · Better customer experiences. Less business workload. <span>Connected to your private business workspace.</span></footer>
    </main>
  </div>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./app.js?v=20261112-3"></script>
</body></html>
